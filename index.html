<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Load Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.35s ease both; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    const INITIAL_HISTORY = [
      ["2025-11-30 14:15", 500], ["2025-11-30 14:27", 500], ["2025-12-06 08:16", 500], 
      ["2025-12-06 08:18", 500], ["2025-12-09 18:15", 500], ["2025-12-09 18:17", 500], 
      ["2025-12-13 08:30", 500], ["2025-12-13 08:31", 500], ["2025-12-14 11:08", 500], 
      ["2025-12-15 17:30", 500], ["2025-12-15 17:33", 500], ["2025-12-19 18:18", 500], 
      ["2025-12-19 18:20", 500], ["2025-12-26 10:33", 500], ["2025-12-28 14:25", 500], 
      ["2025-12-28 14:26", 500], ["2025-12-30 14:35", 500], ["2025-12-30 14:36", 500], 
      ["2026-01-01 14:35", 500], ["2026-01-01 14:37", 500]
    ];

    // Limits
    const LIMITS = {
      amount24h: 1000,
      amount7d:  7000,
      amount30d: 10000,
      count24h:  4,
      count7d:   7,
      count30d:  20,
    };

    const storage = {
      get: (key) => {
        try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : null; }
        catch (e) { return null; }
      },
      set: (key, value) => {
        try { localStorage.setItem(key, JSON.stringify(value)); sessionStorage.setItem(key, JSON.stringify(value)); return true; }
        catch (e) { alert('Warning: Data might not be saved. Check Safari settings.'); return false; }
      },
      remove: (key) => {
        try { localStorage.removeItem(key); sessionStorage.removeItem(key); } catch (e) {}
      }
    };

    // Icons
    const PlusIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    );
    const TrashIcon = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    );
    const DollarIcon = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
    );
    const CalendarIcon = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    );
    const RefreshIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    );
    const DownloadIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    );
    const UploadIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    );

    // ── Summary stat row ───────────────────────────────────────
    function StatRow({ label, used, remaining, total, isCount }) {
      const pct = Math.min(100, Math.round((used / total) * 100));
      const color = pct >= 90 ? 'bg-red-400' : pct >= 70 ? 'bg-yellow-400' : 'bg-emerald-400';
      return (
        <div className="mb-2">
          <div className="flex justify-between text-xs mb-0.5">
            <span className="text-gray-500">{label}</span>
            <span className="font-semibold text-gray-700">
              {isCount ? `${used} / ${total} loads` : `$${used.toLocaleString()} / $${total.toLocaleString()}`}
            </span>
          </div>
          <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
            <div className={`h-full rounded-full transition-all ${color}`} style={{width: `${pct}%`}} />
          </div>
          <div className="text-right text-xs mt-0.5 text-gray-400">
            {isCount ? `${remaining} loads remaining` : `$${remaining.toLocaleString()} remaining`}
          </div>
        </div>
      );
    }

    // ── Summary card for 7d / 30d ──────────────────────────────
    function SummaryCard({ title, color, loads, amountLimit, countLimit, windowMs }) {
      const now = Date.now();
      const windowStart = now - windowMs;
      const recent = loads.filter(l => l.timestamp > windowStart);
      const totalAmt = recent.reduce((s, l) => s + l.amount, 0);
      const totalCount = recent.length;
      const remainingAmt = Math.max(0, amountLimit - totalAmt);
      const remainingCount = Math.max(0, countLimit - totalCount);

      const borderColor = color === 'orange' ? 'border-orange-200' : 'border-purple-200';
      const bgColor    = color === 'orange' ? 'bg-orange-50'    : 'bg-purple-50';
      const titleColor = color === 'orange' ? 'text-orange-800' : 'text-purple-800';
      const badgeBg    = color === 'orange' ? 'bg-orange-100 text-orange-700' : 'bg-purple-100 text-purple-700';

      return (
        <div className={`rounded-xl border-2 ${borderColor} ${bgColor} p-4 fade-in`}>
          <div className="flex items-center justify-between mb-3">
            <span className={`font-bold text-sm ${titleColor}`}>{title}</span>
            <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${badgeBg}`}>
              {totalCount} load{totalCount !== 1 ? 's' : ''}
            </span>
          </div>
          <StatRow label="Amount used"     used={totalAmt}    remaining={remainingAmt}    total={amountLimit} isCount={false} />
          <StatRow label="Load count"      used={totalCount}  remaining={remainingCount}  total={countLimit}  isCount={true}  />
          <div className="mt-3 grid grid-cols-2 gap-2">
            <div className="bg-white rounded-lg p-2 text-center">
              <div className="text-lg font-bold text-gray-800">${totalAmt.toLocaleString()}</div>
              <div className="text-xs text-gray-500">Loaded</div>
            </div>
            <div className="bg-white rounded-lg p-2 text-center">
              <div className="text-lg font-bold text-emerald-600">${remainingAmt.toLocaleString()}</div>
              <div className="text-xs text-gray-500">$ Remaining</div>
            </div>
          </div>
        </div>
      );
    }

    function DiscoverLoadTracker() {
      const [loads, setLoads] = useState([]);
      const [amount, setAmount] = useState('');
      const [datetime, setDatetime] = useState('');
      const [forecast, setForecast] = useState([]);
      const [successMessage, setSuccessMessage] = useState('');
      const [storageWarning, setStorageWarning] = useState(false);

      useEffect(() => {
        const now = new Date();
        setDatetime(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`);
      }, []);

      useEffect(() => {
        let saved = storage.get('discover-loads') || storage.get('discover-loads-backup');
        if (saved && Array.isArray(saved) && saved.length > 0) {
          setLoads(saved);
        } else {
          setLoads(INITIAL_HISTORY.map(([dt, amt]) => ({
            id: `init-${dt}`, datetime: dt, amount: amt, timestamp: new Date(dt).getTime()
          })));
        }
        try { localStorage.setItem('test','test'); localStorage.removeItem('test'); }
        catch (e) { setStorageWarning(true); }
      }, []);

      useEffect(() => {
        if (loads.length > 0) {
          storage.set('discover-loads', loads);
          storage.set('discover-loads-backup', loads);
        }
      }, [loads]);

      useEffect(() => { if (loads.length > 0) calculateForecast(); }, [loads]);

      const addLoad = () => {
        if (!amount || !datetime) { alert('Please enter both amount and date/time'); return; }
        const amt = parseFloat(amount);
        if (amt < 20) { alert('Minimum load is $20'); return; }
        // Allow $500 or $996 as special amounts; otherwise max $1000 per transaction
        const newLoad = {
          id: Date.now().toString(),
          datetime: datetime.replace('T', ' '),
          amount: amt,
          timestamp: new Date(datetime).getTime()
        };
        setLoads(prev => [...prev, newLoad].sort((a, b) => a.timestamp - b.timestamp));
        setSuccessMessage(`$${amt.toFixed(2)} load added ✓`);
        setTimeout(() => setSuccessMessage(''), 3000);
        setAmount('');
        const now = new Date();
        setDatetime(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`);
      };

      const deleteLoad = (id) => {
        const updated = loads.filter(l => l.id !== id);
        setLoads(updated);
        if (updated.length === 0) { storage.remove('discover-loads'); storage.remove('discover-loads-backup'); }
      };

      const exportData = () => {
        const url = URL.createObjectURL(new Blob([JSON.stringify(loads, null, 2)], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url; a.download = `discover-loads-backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click(); URL.revokeObjectURL(url);
      };

      const importData = (event) => {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (Array.isArray(imported)) { setLoads(imported); alert(`Imported ${imported.length} loads!`); }
            else alert('Invalid backup file format');
          } catch { alert('Error reading backup file'); }
        };
        reader.readAsText(file);
      };

      const calculateForecast = () => {
        const now = new Date();
        const nowTs = now.getTime();
        const results = [];
        // Use $996 aware forecast: try both $500 and $996 loads
        const LOAD_AMOUNT = 500;

        const historical = loads.filter(l => l.timestamp <= nowTs);
        const projected = [...historical];

        for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
          const targetDate = new Date(now);
          targetDate.setDate(targetDate.getDate() + dayOffset);
          targetDate.setHours(0, 0, 0, 0);

          let maxLoadCount = 0, bestTime = null;

          for (let hour = 0; hour < 24; hour++) {
            for (let minute = 0; minute < 60; minute++) {
              const checkTime = new Date(targetDate);
              checkTime.setHours(hour, minute, 0, 0);
              const checkTs = checkTime.getTime();
              if (checkTs < nowTs) continue;

              const last24h = checkTs - 86400000;
              const last7d  = checkTs - 604800000;
              const last30d = checkTs - 2592000000;

              const inWindow = (from) => projected.filter(l => l.timestamp > from && l.timestamp < checkTs);

              const sum24h   = inWindow(last24h).reduce((s,l) => s+l.amount, 0);
              const sum7d    = inWindow(last7d).reduce((s,l) => s+l.amount, 0);
              const sum30d   = inWindow(last30d).reduce((s,l) => s+l.amount, 0);
              const cnt24h   = inWindow(last24h).length;
              const cnt7d    = inWindow(last7d).length;
              const cnt30d   = inWindow(last30d).length;

              const availAmt   = Math.min(LIMITS.amount24h - sum24h, LIMITS.amount7d - sum7d, LIMITS.amount30d - sum30d);
              const availCount = Math.min(LIMITS.count24h - cnt24h, LIMITS.count7d - cnt7d, LIMITS.count30d - cnt30d);

              const maxByAmt   = Math.floor(availAmt / LOAD_AMOUNT);
              const canLoad    = Math.max(0, Math.min(maxByAmt, availCount));

              if (canLoad > maxLoadCount) { maxLoadCount = canLoad; bestTime = checkTime; }
            }
          }

          results.push({ date: targetDate.toISOString().split('T')[0], loadCount: maxLoadCount, amount: maxLoadCount * LOAD_AMOUNT, time: bestTime });

          if (maxLoadCount > 0 && bestTime) {
            for (let i = 0; i < maxLoadCount; i++) {
              projected.push({
                id: `proj-${dayOffset}-${i}`,
                datetime: bestTime.toISOString().replace('T',' ').slice(0,16),
                amount: LOAD_AMOUNT,
                timestamp: bestTime.getTime() + (i * 60000)
              });
            }
          }
        }
        setForecast(results);
      };

      // ── Compute summary stats ──────────────────────────────
      const now = Date.now();
      const last7dLoads  = loads.filter(l => l.timestamp > now - 604800000);
      const last30dLoads = loads.filter(l => l.timestamp > now - 2592000000);

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-purple-100 p-4">
          <div className="max-w-2xl mx-auto">
            {storageWarning && (
              <div className="bg-yellow-100 border-2 border-yellow-500 text-yellow-800 px-4 py-3 rounded-lg mb-4 text-sm">
                ⚠️ Storage may not work. Settings → Safari → Disable "Block All Cookies"
              </div>
            )}

            {/* ── Header card ── */}
            <div className="bg-white rounded-2xl shadow-xl p-6 mb-4">
              <div className="flex items-center justify-between mb-5">
                <h1 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                  <DollarIcon /> Discover Load Tracker
                </h1>
              </div>

              {/* Backup */}
              <div className="bg-blue-50 border-2 border-blue-200 rounded-lg p-3 mb-4 text-sm">
                <div className="font-semibold text-blue-900 mb-1">💾 Data Backup</div>
                <div className="text-blue-800 mb-2">Auto-saved. Export to keep a manual backup:</div>
                <div className="flex gap-2">
                  <button onClick={exportData} className="flex items-center gap-1 px-3 py-1.5 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">
                    <DownloadIcon /> Export
                  </button>
                  <label className="flex items-center gap-1 px-3 py-1.5 bg-green-600 text-white rounded hover:bg-green-700 text-sm cursor-pointer">
                    <UploadIcon /> Import
                    <input type="file" accept=".json" onChange={importData} className="hidden" />
                  </label>
                </div>
              </div>

              {/* Add load form */}
              <div className="space-y-3 mb-5">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Amount ($) — Min $20</label>
                  <div className="flex gap-2">
                    <input
                      type="number" step="0.01" value={amount}
                      onChange={(e) => setAmount(e.target.value)}
                      placeholder="500.00"
                      className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent text-lg"
                    />
                    {/* Quick amount buttons */}
                    <button onClick={() => setAmount('498')}  className="px-3 py-2 bg-orange-100 text-orange-700 rounded-lg text-sm font-semibold hover:bg-orange-200">$498</button>
                    <button onClick={() => setAmount('996')}  className="px-3 py-2 bg-purple-100 text-purple-700 rounded-lg text-sm font-semibold hover:bg-purple-200">$996</button>
                  </div>
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Date & Time</label>
                  <input
                    type="datetime-local" value={datetime}
                    onChange={(e) => setDatetime(e.target.value)}
                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                  />
                </div>
                <button onClick={addLoad} className="w-full bg-orange-600 text-white py-3 rounded-lg font-semibold hover:bg-orange-700 transition-colors flex items-center justify-center gap-2">
                  <PlusIcon /> Add Load
                </button>
                {successMessage && (
                  <div className="bg-green-100 border-2 border-green-500 text-green-700 px-4 py-3 rounded-lg text-center font-semibold fade-in">
                    {successMessage}
                  </div>
                )}
              </div>

              {/* Limits reference */}
              <div className="bg-purple-50 rounded-lg p-4 text-sm space-y-1">
                <div className="font-bold text-purple-900 mb-2">Loading Limits:</div>
                <div className="text-purple-800">• $20 minimum per transaction</div>
                <div className="text-purple-800">• $1,000 max per 24 hours</div>
                <div className="text-purple-800">• $7,000 max per 7 days</div>
                <div className="text-purple-800">• $10,000 max per 30 days</div>
                <div className="text-purple-800 font-semibold mt-2">Count Limits:</div>
                <div className="text-purple-800">• Max 4 loads per 24 hours</div>
                <div className="text-purple-800">• Max 7 loads per 7 days</div>
                <div className="text-purple-800">• Max 20 loads per 30 days</div>
                <div className="text-purple-800 mt-2 italic">💡 $996 load counts as 1 transaction toward count limits</div>
              </div>
            </div>

            {/* ── Summary Cards ── */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
              <SummaryCard
                title="Last 7 Days"
                color="orange"
                loads={loads}
                amountLimit={LIMITS.amount7d}
                countLimit={LIMITS.count7d}
                windowMs={604800000}
              />
              <SummaryCard
                title="Last 30 Days"
                color="purple"
                loads={loads}
                amountLimit={LIMITS.amount30d}
                countLimit={LIMITS.count30d}
                windowMs={2592000000}
              />
            </div>

            {/* ── Forecast ── */}
            {forecast.length > 0 && (
              <div className="bg-white rounded-2xl shadow-xl p-6 mb-4">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <CalendarIcon /> 7-Day Load Forecast
                  </h2>
                  <button onClick={calculateForecast} className="flex items-center gap-2 px-4 py-2 bg-orange-100 text-orange-700 rounded-lg hover:bg-orange-200 transition-colors">
                    <RefreshIcon /> Refresh
                  </button>
                </div>
                <div className="space-y-3">
                  {forecast.map((day, idx) => (
                    <div key={idx} className={`p-4 rounded-lg ${day.loadCount === 0 ? 'bg-red-50 border-2 border-red-200' : 'bg-green-50 border-2 border-green-200'}`}>
                      {day.loadCount === 0 ? (
                        <div>
                          <div className="font-bold text-red-700 text-lg">{day.date}</div>
                          <div className="text-red-600 font-semibold">Sorry, Can't Load Today!</div>
                        </div>
                      ) : (
                        <div>
                          <div className="font-bold text-green-700 text-lg">
                            {day.date} {day.time ? `${String(day.time.getHours()).padStart(2,'0')}:${String(day.time.getMinutes()).padStart(2,'0')}` : ''}
                          </div>
                          <div className="text-green-600 font-semibold">
                            {day.loadCount} load{day.loadCount > 1 ? 's' : ''} available (${day.amount.toLocaleString()} total)
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ── History ── */}
            {loads.length > 0 && (
              <div className="bg-white rounded-2xl shadow-xl p-6">
                <h2 className="text-xl font-bold text-gray-800 mb-4">
                  Load History ({loads.length} loads · ${loads.reduce((s,l)=>s+l.amount,0).toLocaleString()} total)
                </h2>
                <div className="space-y-2 max-h-96 overflow-y-auto">
                  {loads.slice().reverse().map((load) => (
                    <div key={load.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">
                      <div>
                        <div className="font-bold text-gray-800">${load.amount.toFixed(2)}</div>
                        <div className="text-sm text-gray-600">
                          {load.datetime.replace(/(\d{1,2}):(\d{2})(?::(\d{2}))?$/, (_, h, m) => `${String(h).padStart(2,'0')}:${m}`)}
                        </div>
                      </div>
                      <button onClick={() => deleteLoad(load.id)} className="text-red-400 hover:text-red-600 p-2">
                        <TrashIcon />
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<DiscoverLoadTracker />, document.getElementById('root'));
  </script>
</body>
</html>
